syntax = "proto3";

package vitalmesh.events.v1;

import "google/protobuf/timestamp.proto";
import "vitalmesh/events/v1/common.proto";

// ---- Payload families carried under user.event.received (EVENT_BACKBONE.md s12) ----

// One extensible message with a registered metric_type, not one message per metric
// (wger's user-defined measurement categories, decision D17).
message MeasurementRecorded {
  string metric_type = 1;  // registry key, e.g. "body_weight", "resting_heart_rate"
  Quantity value = 2;
  google.protobuf.Timestamp measured_at = 3;
  string notes = 4;
  map<string, string> extra_data = 5;  // typed and validated in the domain layer
}

message FoodItem {
  string food_ref = 1;  // catalogue id when known
  string name = 2;
  Quantity amount = 3;
}

message MealLogged {
  google.protobuf.Timestamp eaten_at = 1;
  EntryType entry_type = 2;
  repeated FoodItem items = 3;
}

// Sessions have a start AND an end, not a single time (decision D17).
message WorkoutSessionCompleted {
  google.protobuf.Timestamp started_at = 1;
  google.protobuf.Timestamp ended_at = 2;
  string activity_type = 3;
  string notes = 4;
}

// DRAFT: wger has no sleep entities; shape follows common wearable APIs and must be
// re-checked against the Fitbit Web API documentation before Phase 1 (decision D17).
message SleepSessionRecorded {
  enum Stage {
    STAGE_UNSPECIFIED = 0;
    STAGE_AWAKE = 1;
    STAGE_LIGHT = 2;
    STAGE_DEEP = 3;
    STAGE_REM = 4;
  }
  message Segment {
    Stage stage = 1;
    google.protobuf.Timestamp started_at = 2;
    google.protobuf.Timestamp ended_at = 3;
  }
  google.protobuf.Timestamp started_at = 1;
  google.protobuf.Timestamp ended_at = 2;
  repeated Segment segments = 3;
}

// Subjective feedback is its own event (wger's workout "impression", decision D17);
// it feeds the Engagement and Coach roles.
message FeedbackRecorded {
  enum Impression {
    IMPRESSION_UNSPECIFIED = 0;
    IMPRESSION_BAD = 1;
    IMPRESSION_NEUTRAL = 2;
    IMPRESSION_GOOD = 3;
  }
  string subject_event_id = 1;  // the event this feedback is about
  Impression impression = 2;
  string notes = 3;
}

// A meal-plan slot changed (Mealie's PlanEntry, decision D20). Free-text entries with
// no recipe are first-class.
message MealPlanEntryChanged {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_CREATED = 1;
    KIND_UPDATED = 2;
    KIND_DELETED = 3;
  }
  Kind kind = 1;
  string plan_date = 2;  // ISO-8601 calendar date, YYYY-MM-DD
  EntryType entry_type = 3;
  string title = 4;
  string text = 5;
  optional string recipe_id = 6;
  double recipe_scale = 7;
}

// ---- Emitted by the state processor on user.state ----
message HealthStateUpdated {
  google.protobuf.Timestamp as_of = 1;
  map<string, Quantity> latest_metrics = 2;  // metric_type -> latest value
  string state_version = 3;
}

// ---- Lab results (decisions D42, D45) ----

// The lab's own reference text is always kept verbatim. Low and high are set only when the
// text parsed cleanly into a simple interval or one-sided limit; categorical bands (lipids,
// HbA1c) stay in raw_text with parsed = false and the result is then "unclassified", never
// guessed.
message ReferenceRange {
  string raw_text = 1;
  bool parsed = 2;
  optional double low = 3;
  optional double high = 4;
}

message LabResultRecorded {
  string marker_code = 1;  // LOINC code when known, else empty
  string marker_name = 2;  // as printed by the lab
  oneof result {
    Quantity numeric = 3;  // value always carries its unit
    string text = 4;       // qualitative result, e.g. "Normocytic"
  }
  ReferenceRange reference = 5;
  google.protobuf.Timestamp collected_at = 6;
  bool derived = 7;  // "Method: Calculated": not an independent measurement
}

// ---- Recommendations (published by the T0 path and, later, the Guardian/Release path) ----

message RecommendationClaim {
  string text = 1;
  Provenance provenance = 2;
  optional string source = 3;  // calculator+version, citation id, or inference basis
  optional string metric = 4;  // registered metric name when the claim carries a number
  optional Quantity quantity = 5;
}

// Published on recommendations.released; only the Guardian-checked path may produce it.
message RecommendationReleased {
  string recommendation_id = 1;
  repeated RecommendationClaim claims = 2;
  string engine_version = 3;
  string rules_version = 4;
  google.protobuf.Timestamp generated_at = 5;
  // Added for T3 answers (D68); T0 releases leave them empty.
  string summary = 6;                 // the plain-language reply the user sees
  repeated Citation citations = 7;    // verified quotes behind the cited claims
  bool partial = 8;                   // some specialists did not finish
  repeated Specialist missing = 9;
  string question = 10;
}

message GuardianViolation {
  string rule = 1;
  string message = 2;
  optional string claim_text = 3;
}

// ---- The T3 multi-agent run (docs/EVENT_BACKBONE.md section 4, decision D68) ----
// One run = one correlation_id. Each stage has ONE payload; the specialist is a field.

// A user question that passed the ingress screen. Published by the API, consumed by Triage.
message QuestionAsked {
  string question = 1;
  string session_id = 2;
}

// Triage's plan, in code: which specialists, how risky, what each may spend. The deadline
// travels in the envelope (deadline_at); the tier in the envelope tier.
message RunPlanned {
  string question = 1;
  repeated Specialist specialists = 2;
  RiskLevel risk = 3;
  uint32 max_model_calls = 4;  // per specialist
  bool degraded = 5;           // the plan was reduced (back-pressure or a budget rule)
  repeated string rule_ids = 6;  // why: the Triage rules that fired
}

// A verified quote from a corpus document supporting a statement.
message Citation {
  string document = 1;
  string locator = 2;  // e.g. "p. 34"
  string licence = 3;
  string source_url = 4;
  string quote = 5;
}

enum AdviceStatus {
  ADVICE_STATUS_UNSPECIFIED = 0;
  ADVICE_ANSWERED = 1;  // the model's checked prose
  ADVICE_FALLBACK = 2;  // plain facts built only from tool results (the draft failed checks)
  ADVICE_DECLINED = 3;  // the specialist refused (out of scope or no support)
  ADVICE_FAILED = 4;    // could not run (provider outage, missing profile); see failure_code
}

// One specialist's contribution. FAILED is published rather than staying silent, so the
// Aggregator does not wait for the deadline on a known failure.
message AdviceCompleted {
  Specialist specialist = 1;
  AdviceStatus status = 2;
  string text = 3;
  repeated RecommendationClaim claims = 4;  // computed claims returned by the tools used
  repeated Citation citations = 5;
  uint32 model_calls = 6;
  uint32 tool_calls = 7;
  string failure_code = 8;
}

// Everything expected arrived, or the deadline passed (partial = true).
message AdviceBundleReady {
  string question = 1;
  RiskLevel risk = 2;
  repeated AdviceCompleted parts = 3;
  repeated Specialist missing = 4;
  bool partial = 5;
  string reason = 6;  // "complete" or "deadline"
}

// The Synthesizer's merge. revision 0 is the first draft, 1 the single allowed rewrite.
message RecommendationDrafted {
  string recommendation_id = 1;
  string question = 2;
  string text = 3;
  repeated RecommendationClaim claims = 4;
  repeated Citation citations = 5;
  RiskLevel risk = 6;
  bool partial = 7;
  repeated Specialist missing = 8;
  uint32 revision = 9;
  bool used_fallback = 10;  // the model's merge failed checks; text is the plain assembly
}

// The Guardian cleared a draft. Release (low risk) or the Checker (medium and up) consumes it.
message SafetyCleared {
  RecommendationDrafted draft = 1;
  string rules_version = 2;
}

enum ReviewVerdict {
  REVIEW_VERDICT_UNSPECIFIED = 0;
  REVIEW_APPROVED = 1;
  REVIEW_REVISE = 2;   // allowed once, then it becomes a rejection
  REVIEW_REJECTED = 3;
}

// The Checker's independent review of a cleared draft.
message ReviewCompleted {
  string recommendation_id = 1;
  ReviewVerdict verdict = 2;
  repeated string problems = 3;
  RecommendationDrafted draft = 4;
  string rules_version = 5;
}

// Case file for the human reviewer (the Escalation Briefer's output).
message ReviewRequested {
  string recommendation_id = 1;
  string briefing = 2;
  repeated string reasons = 3;
  RecommendationDrafted draft = 4;
  string rules_version = 5;
}

enum ReviewDecision {
  REVIEW_DECISION_UNSPECIFIED = 0;
  DECISION_APPROVE = 1;
  DECISION_REJECT = 2;
}

// The human's decision; resumes the paused run.
message ReviewDecided {
  string recommendation_id = 1;
  ReviewDecision decision = 2;
  string reviewer_id = 3;
  string note = 4;
}

// Published on safety.blocked when the Guardian does not clear a recommendation.
message RecommendationBlocked {
  string recommendation_id = 1;
  repeated GuardianViolation violations = 2;
  string rules_version = 3;
}
