name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Install
        run: uv sync --frozen
      - name: Generate protobuf code
        run: uv run python scripts/gen_proto.py
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Types
        run: uv run mypy libs services
      - name: Unit tests
        run: uv run pytest -m "not integration" -q

  security:
    name: dependency and code scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Known-vulnerable dependencies (locked set)
        run: |
          uv export --frozen --no-hashes --no-emit-workspace -o requirements-audit.txt
          uvx pip-audit==2.10.1 -r requirements-audit.txt --no-deps --disable-pip
      - name: Static scan (medium severity and above)
        run: uvx bandit==1.9.4 -q -r libs services scripts -x "*/tests/*,*/test_*" -ll

  integration:
    name: integration tests (Kafka, Schema Registry, Redis)
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Install
        run: uv sync --frozen
      - name: Generate protobuf code
        run: uv run python scripts/gen_proto.py
      - name: Start the stack
        run: docker compose -f infra/docker-compose.yml up -d --wait
      - name: Integration tests
        run: uv run pytest -m integration -q
      - name: Stack logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs --no-color --tail 200
      - name: Stop the stack
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v
