# Local development stack (Phase 0): only what the code exercises today.
# Neo4j arrives with the knowledge graph (Phase 1); Langfuse with the first LLM calls (Phase 2).
# All ports are bound to 127.0.0.1: nothing is reachable from the LAN.
#
#   docker compose -f infra/docker-compose.yml up -d --wait
#   docker compose -f infra/docker-compose.yml down -v      # also deletes the data volumes
name: vitalmesh

services:
  kafka:
    image: apache/kafka:4.0.0
    container_name: vitalmesh-kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      # Single combined broker+controller node (KRaft, no ZooKeeper).
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://:19092,PLAINTEXT_HOST://:9092,CONTROLLER://:29093
      # 127.0.0.1, not localhost: clients resolve localhost to ::1 first and stall ~2 s per connection
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Topics come from the topic contract (libs/common topics.py), never from a typo.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  schema-registry:
    image: confluentinc/cp-schema-registry:7.9.0
    container_name: vitalmesh-schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:19092
      # Breaking schema changes are rejected at registration time.
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: BACKWARD
      SCHEMA_REGISTRY_HEAP_OPTS: "-Xms128m -Xmx256m"
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/subjects > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  redis:
    image: redis:7.4-alpine
    container_name: vitalmesh-redis
    # noeviction: idempotency and state keys must never be silently evicted; a full Redis
    # fails loudly instead of letting duplicates through.
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  kafka-data:
