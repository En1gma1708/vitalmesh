[project]
name = "vitalmesh-accounts"
version = "0.1.0"
description = "Accounts and authentication: argon2id passwords, signed access tokens, rotating refresh tokens, lockout, rate limits, audit log"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2", "redis>=5", "psycopg[binary]>=3.2", "psycopg-pool>=3.2", "pyjwt>=2.8", "argon2-cffi==25.1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vitalmesh_accounts"]
