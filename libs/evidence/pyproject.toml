[project]
name = "vitalmesh-evidence"
version = "0.1.0"
description = "Evidence agent: retrieve guideline chunks, draft a cited answer, verify every citation and number in code, refuse when unsupported"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2", "langgraph>=0.2", "vitalmesh-llm", "vitalmesh-retrieval"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vitalmesh_evidence"]
