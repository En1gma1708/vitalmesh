[project]
name = "vitalmesh-concierge"
version = "0.1.0"
description = "Concierge: input screen, intent routing and coaching replies in front of the specialists"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2", "vitalmesh-llm", "vitalmesh-specialists", "vitalmesh-tracing"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vitalmesh_concierge"]
