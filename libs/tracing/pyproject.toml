[project]
name = "vitalmesh-tracing"
version = "0.1.0"
description = "Langfuse tracing behind a small interface: no-op without keys, nested observations, no PII by construction"
requires-python = ">=3.12,<3.13"
dependencies = ["langfuse>=5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vitalmesh_tracing"]
