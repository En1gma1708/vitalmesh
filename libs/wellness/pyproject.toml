[project]
name = "vitalmesh-wellness"
version = "0.1.0"
description = "Pure wellness domain: calculators, typed claims with provenance, Safety Guardian rules (no I/O, no LLM)"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vitalmesh_wellness"]
