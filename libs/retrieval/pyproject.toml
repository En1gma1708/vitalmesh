[project]
name = "vitalmesh-retrieval"
version = "0.1.0"
description = "Guideline corpus store: Postgres + pgvector, full-text and vector search with rank fusion; every document carries its licence"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "fastembed>=0.9.0",
    "pypdf>=6.21.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vitalmesh_retrieval"]
