[project]
name = "vitalmesh-stores"
version = "0.1.0"
description = "Redis read models shared by services and agents: profiles, lab results, measurement history"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2", "redis>=5", "vitalmesh-wellness"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vitalmesh_stores"]
