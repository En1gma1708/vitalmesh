[project]
name = "vitalmesh-common"
version = "0.1.0"
description = "Shared domain code: event envelope, failure contract, topic contract, idempotency, Kafka helpers"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "confluent-kafka[protobuf,schemaregistry]>=2.5",
    "protobuf>=5",
    "redis>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vitalmesh_common", "src/vitalmesh"]
