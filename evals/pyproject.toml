[project]
name = "vitalmesh-evals"
version = "0.1.0"
description = "Golden-case eval harness: deterministic graders, per-category pass rates, cached model calls"
requires-python = ">=3.12,<3.13"
dependencies = ["vitalmesh-wellness", "vitalmesh-llm", "redis>=5"]

[tool.uv.sources]
vitalmesh-wellness = { workspace = true }
vitalmesh-llm = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vitalmesh_evals"]
