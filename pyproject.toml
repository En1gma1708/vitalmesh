[project]
name = "vitalmesh"
version = "0.1.0"
description = "Event-driven multi-agent health recommendation platform (workspace root)"
requires-python = ">=3.12,<3.13"
readme = "README.md"
dependencies = ["vitalmesh-common", "vitalmesh-processor", "vitalmesh-wellness", "vitalmesh-t0", "vitalmesh-api", "vitalmesh-kg", "vitalmesh-llm", "vitalmesh-retrieval", "vitalmesh-evidence", "vitalmesh-specialists", "vitalmesh-tracing", "vitalmesh-concierge", "vitalmesh-stores", "vitalmesh-agents", "vitalmesh-evals"]

[tool.uv.workspace]
members = ["libs/common", "libs/wellness", "services/processor", "services/t0", "services/api", "services/kg", "libs/llm", "libs/retrieval", "libs/evidence", "libs/specialists", "libs/tracing", "libs/concierge", "libs/stores", "services/agents", "evals"]

[tool.uv.sources]
vitalmesh-common = { workspace = true }
vitalmesh-processor = { workspace = true }
vitalmesh-wellness = { workspace = true }
vitalmesh-t0 = { workspace = true }
vitalmesh-api = { workspace = true }
vitalmesh-kg = { workspace = true }
vitalmesh-llm = { workspace = true }
vitalmesh-retrieval = { workspace = true }
vitalmesh-evidence = { workspace = true }
vitalmesh-specialists = { workspace = true }
vitalmesh-tracing = { workspace = true }
vitalmesh-concierge = { workspace = true }
vitalmesh-stores = { workspace = true }
vitalmesh-agents = { workspace = true }
vitalmesh-evals = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "grpcio-tools>=1.66",
    "hypothesis>=6",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["libs/common/src/vitalmesh"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["libs/common/src/vitalmesh/"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["vitalmesh.events.*", "confluent_kafka.*", "google.protobuf.*"]
ignore_errors = true
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["libs", "services", "evals"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs the docker compose stack (Kafka, Schema Registry, Redis); skipped when unreachable",
]
