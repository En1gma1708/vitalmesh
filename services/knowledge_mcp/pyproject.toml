[project]
name = "vitalmesh-knowledge-mcp"
version = "0.1.0"
description = "Knowledge MCP server: the licensed guideline corpus as read-only tools over stateless Streamable HTTP"
requires-python = ">=3.12,<3.13"
dependencies = ["vitalmesh-evidence", "vitalmesh-retrieval", "mcp==2.3.0"]

[tool.uv.sources]
vitalmesh-evidence = { workspace = true }
vitalmesh-retrieval = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vitalmesh_knowledge_mcp"]
