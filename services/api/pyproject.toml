[project]
name = "vitalmesh-api"
version = "0.1.0"
description = "API gateway: validated ingress to Kafka and the synchronous in-process T0 recommendation"
requires-python = ">=3.12,<3.13"
dependencies = ["vitalmesh-common", "vitalmesh-wellness", "vitalmesh-t0", "fastapi>=0.115", "uvicorn>=0.30", "redis>=5"]

[tool.uv.sources]
vitalmesh-common = { workspace = true }
vitalmesh-wellness = { workspace = true }
vitalmesh-t0 = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vitalmesh_api"]
