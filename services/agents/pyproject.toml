[project]
name = "vitalmesh-agents"
version = "0.1.0"
description = "The T3 multi-agent run on Kafka: Triage, specialists, Aggregator, Synthesizer, Guardian gate, Checker, Briefer, Release"
requires-python = ">=3.12,<3.13"
dependencies = [
  "vitalmesh-common",
  "vitalmesh-wellness",
  "vitalmesh-stores",
  "vitalmesh-llm",
  "vitalmesh-evidence",
  "vitalmesh-specialists",
  "vitalmesh-tracing",
  "redis>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vitalmesh_agents"]
