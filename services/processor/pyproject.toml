[project]
name = "vitalmesh-processor"
version = "0.1.0"
description = "State processor: consumes user events idempotently, updates per-user state, emits state events"
requires-python = ">=3.12,<3.13"
dependencies = ["vitalmesh-common", "vitalmesh-wellness", "vitalmesh-stores", "redis>=5"]

[tool.uv.sources]
vitalmesh-common = { workspace = true }
vitalmesh-wellness = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vitalmesh_processor"]
