[project]
name = "vitalmesh-kg"
version = "0.1.0"
description = "Knowledge graph: loads the seed constraint graph into Neo4j and compiles a Redis lookup for the hot path"
requires-python = ">=3.12,<3.13"
dependencies = ["vitalmesh-wellness", "neo4j>=5.20", "redis>=5"]

[tool.uv.sources]
vitalmesh-wellness = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vitalmesh_kg"]
